<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ituri Ebola — Genomic Dashboard</title>
  <!-- PearTree bundle: exposes window.PearTreeEmbed (loads before the module) -->
  <script src="%BASE_URL%peartree.bundle.min.js"></script>
</head>
<body>
  <header id="app-header">
    <span class="dot" title="Live — regularly updated" aria-hidden="true"></span>
    <div class="titles">
      <h1>Genomic Epidemiology of 2026 Ebola Outbreak in the DRC</h1>
      <div class="sub">Last updated on: <span id="last-updated">—</span></div>
    </div>
  </header>
  <div id="app">
    <div id="left">
      <div id="tree" class="panel"><h3>Phylogeny <button id="legend-toggle" class="legend-toggle" type="button" title="Show/hide the health-zone colour legend">Legend</button></h3><div id="tree-body" class="panel-body"></div></div>
      <div id="gutter-h" class="gutter gutter-h" title="Drag to resize"><span class="grip grip-h"></span></div>
      <div id="timeseries" class="panel"><h3>Sample distribution <span id="dist-scope" class="dist-scope"></span><span id="dist-note" class="dist-note"></span><button id="dist-beyond" class="dist-download" type="button" title="Show samples dated after the tree's latest tip">→</button><button id="dist-download" class="dist-download" type="button" title="Download daily counts (CSV)">⤓ CSV</button></h3><div id="timeseries-body" class="panel-body"></div></div>
    </div>
    <div id="gutter-v" class="gutter gutter-v" title="Drag to resize"><span class="grip grip-v"></span></div>
    <div id="map" class="panel">
      <h3 class="map-head"><button id="tab-map" class="map-tab active" type="button">Outbreak map</button><button id="tab-prio" class="map-tab" type="button">Sequencing prioritisation</button><span id="map-ct" class="dist-ct map-ct" style="display:none"><label>Ct&lt;</label><input type="number" min="1" max="99" step="1" placeholder="off"></span></h3>
      <div id="map-body" class="panel-body"></div>
      <div id="prio-body" class="panel-body" style="display:none; overflow:auto; padding:14px 16px;"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
